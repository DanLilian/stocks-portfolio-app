[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "S105", "S106"]
"scripts/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["market_data", "portfolio_service", "tests"]
